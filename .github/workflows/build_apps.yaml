name: Build app container images
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated)'
        required: true
        default: 'linux/amd64,linux/arm64'
      app_types:
        description: 'App types to build (comma-separated). Only used when apps_directory is set.'
        required: false
        default: ''
      apps_directory:
        description: 'Single directory to build from (e.g. apps/bundles). Leave empty to build from all configured groups based on changes.'
        required: false
        default: ''
      image_prefix:
        description: 'Image prefix to use when apps_directory is set manually (ignored when apps_directory is empty)'
        required: false
        default: 'app'
      source_subdir:
        description: 'Subdirectory under each app type that holds the Containerfile and build context (e.g. "src"). Only used when apps_directory is set manually.'
        required: false
        default: ''
  push:
    branches:
      - main

env:
  # Directory -> image prefix mapping used for push builds, and for
  # workflow_dispatch runs that don't specify a single apps_directory.
  # "subdir" is the path under each app-type folder that holds the
  # Containerfile and build context; use "" if the Containerfile sits
  # directly in <directory>/<type>/.
  # Add more entries here if you introduce another apps/* directory.
  APP_GROUPS: '[{"directory":"apps/bundles","prefix":"app-bundle","subdir":""},{"directory":"apps/containers","prefix":"app","subdir":"src"}]'

jobs:
  # Detect changed / requested apps across all configured groups
  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps-json: ${{ steps.changes.outputs.apps-json }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed / requested apps
        id: changes
        run: |
          set -euo pipefail

          APP_GROUPS='${{ env.APP_GROUPS }}'
          APPS_JSON='[]'

          add_app() {
            local type="$1" dir="$2" prefix="$3" subdir="$4"
            APPS_JSON=$(echo "$APPS_JSON" | jq -c --arg type "$type" --arg dir "$dir" --arg prefix "$prefix" --arg subdir "$subdir" \
              '. + [{"type":$type,"directory":$dir,"prefix":$prefix,"subdir":$subdir}]')
          }

          build_path() {
            # $1=dir $2=type $3=subdir -> the folder that should contain the Containerfile
            if [ -n "$3" ]; then echo "$1/$2/$3"; else echo "$1/$2"; fi
          }

          has_containerfile() {
            [ -f "$1/Containerfile" ] || [ -f "$1/containerfile" ]
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.apps_directory }}" ]; then
            # --- Manual dispatch, single directory/prefix (original behavior) ---
            DIR="${{ github.event.inputs.apps_directory }}"
            PREFIX="${{ github.event.inputs.image_prefix }}"
            [ -n "$PREFIX" ] || PREFIX="app"
            SUBDIR="${{ github.event.inputs.source_subdir }}"
            APP_TYPES="${{ github.event.inputs.app_types }}"

            if [ -z "$APP_TYPES" ]; then
              for d in "$DIR"/*/; do
                [ -d "$d" ] || continue
                t=$(basename "$d")
                has_containerfile "$(build_path "$DIR" "$t" "$SUBDIR")" && APP_TYPES="${APP_TYPES:+$APP_TYPES,}$t"
              done
            fi

            IFS=',' read -ra TYPES <<< "$APP_TYPES"
            for t in "${TYPES[@]}"; do
              if has_containerfile "$(build_path "$DIR" "$t" "$SUBDIR")"; then
                add_app "$t" "$DIR" "$PREFIX" "$SUBDIR"
              else
                echo "Skipping $DIR/$t: no Containerfile found under $(build_path "$DIR" "$t" "$SUBDIR")"
              fi
            done

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # --- Manual dispatch, no directory given: build every app in every group ---
            for row in $(echo "$APP_GROUPS" | jq -c '.[]'); do
              DIR=$(echo "$row" | jq -r '.directory')
              PREFIX=$(echo "$row" | jq -r '.prefix')
              SUBDIR=$(echo "$row" | jq -r '.subdir')
              [ -d "$DIR" ] || continue
              for d in "$DIR"/*/; do
                [ -d "$d" ] || continue
                t=$(basename "$d")
                has_containerfile "$(build_path "$DIR" "$t" "$SUBDIR")" && add_app "$t" "$DIR" "$PREFIX" "$SUBDIR"
              done
            done

          else
            # --- Push event: detect changed app types per configured group ---
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            for row in $(echo "$APP_GROUPS" | jq -c '.[]'); do
              DIR=$(echo "$row" | jq -r '.directory')
              PREFIX=$(echo "$row" | jq -r '.prefix')
              SUBDIR=$(echo "$row" | jq -r '.subdir')

              if echo "$CHANGED_FILES" | grep -q "^${DIR}/[^/]\+/"; then
                POTENTIAL_TYPES=$(echo "$CHANGED_FILES" | grep -E "^${DIR}/[^/]+/" | sed "s|^${DIR}/\([^/]*\)/.*|\1|" | sort -u)
                for t in $POTENTIAL_TYPES; do
                  if has_containerfile "$(build_path "$DIR" "$t" "$SUBDIR")"; then
                    echo "Including changed app: $DIR/$t ($PREFIX-$t)"
                    add_app "$t" "$DIR" "$PREFIX" "$SUBDIR"
                  else
                    echo "Skipping deleted/invalid app: $DIR/$t"
                  fi
                done
              fi
            done
          fi

          APP_COUNT=$(echo "$APPS_JSON" | jq 'length')
          if [ "$APP_COUNT" -eq 0 ]; then
            echo "No app changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "apps-json=[]" >> $GITHUB_OUTPUT
          else
            echo "Apps to build:"
            echo "$APPS_JSON" | jq .
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "apps-json=$(echo "$APPS_JSON" | jq -c .)" >> $GITHUB_OUTPUT
          fi

  # Determine version tags for each app (keyed by <prefix>-<type>, i.e. the image name)
  determine-versions:
    name: Determine version tags
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    outputs:
      app-versions: ${{ steps.versions.outputs.app-versions }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version numbers
        id: versions
        run: |
          set -euo pipefail

          APPS_JSON='${{ needs.detect-changes.outputs.apps-json }}'
          VERSIONS_JSON='{}'

          for row in $(echo "$APPS_JSON" | jq -c '.[]'); do
            TYPE=$(echo "$row" | jq -r '.type')
            DIR=$(echo "$row" | jq -r '.directory')
            PREFIX=$(echo "$row" | jq -r '.prefix')
            IMAGE_NAME="${PREFIX}-${TYPE}"
            IMAGE_BASE="${{ env.REGISTRY }}/${IMAGE_NAME}"

            echo "Determining version for $DIR ($IMAGE_BASE)"

            EXISTING_TAGS=""
            if skopeo list-tags "docker://${IMAGE_BASE}" >/tmp/tags.json 2>/dev/null; then
              EXISTING_TAGS=$(jq -r '.Tags[]' /tmp/tags.json | grep -oE '^v[0-9]+$' | sort -V || echo "")
            fi

            if [ -z "$EXISTING_TAGS" ]; then
              echo "No existing version tags found, starting with v1"
              NEXT_VERSION="v1"
            else
              HIGHEST_VERSION=$(echo "$EXISTING_TAGS" | tail -n1)
              HIGHEST_NUM=$(echo "$HIGHEST_VERSION" | sed 's/v//')
              NEXT_VERSION="v$((HIGHEST_NUM + 1))"
              echo "Highest existing version: $HIGHEST_VERSION, next version: $NEXT_VERSION"
            fi

            VERSIONS_JSON=$(echo "$VERSIONS_JSON" | jq -c --arg k "$IMAGE_NAME" --arg v "$NEXT_VERSION" '. + {($k): $v}')
          done

          echo "app-versions=$(echo "$VERSIONS_JSON" | jq -c .)" >> $GITHUB_OUTPUT
          echo "Final app versions:"
          echo "$VERSIONS_JSON" | jq .

  # Setup job: build the platform x app build matrix
  setup:
    name: Setup build parameters
    runs-on: ubuntu-latest
    needs: [detect-changes, determine-versions]
    if: needs.detect-changes.outputs.has-changes == 'true'
    outputs:
      platforms: ${{ steps.setup.outputs.platforms }}
      matrix: ${{ steps.setup.outputs.matrix }}
      apps-json: ${{ needs.detect-changes.outputs.apps-json }}
      app-versions: ${{ needs.determine-versions.outputs.app-versions }}
    steps:
      - name: Setup build parameters
        id: setup
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ github.event.inputs.platforms }}"
          else
            PLATFORMS="linux/amd64,linux/arm64"
          fi
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "Building for platforms: $PLATFORMS"

          APPS_JSON='${{ needs.detect-changes.outputs.apps-json }}'

          MATRIX=$(jq -nc --argjson apps "$APPS_JSON" --arg platforms "$PLATFORMS" '
            ($platforms | split(",")) as $plats |
            {
              include: [
                $apps[] as $app |
                $plats[] as $platform |
                {
                  platform: $platform,
                  arch: ($platform | sub("^linux/"; "")),
                  runner: (if ($platform | sub("^linux/"; "")) == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end),
                  type: $app.type,
                  directory: $app.directory,
                  prefix: $app.prefix,
                  subdir: $app.subdir
                }
              ]
            }')

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT
          echo "Matrix:"
          echo "$MATRIX" | jq .

  # Matrix job: build the container image for each platform x app combination
  build-image:
    name: Build app container image
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.build.outputs.image }}
      tags: ${{ steps.build.outputs.tags }}
    env:
      IMAGE_NAME: ${{ matrix.prefix }}-${{ matrix.type }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SMDEV_CONTAINER_OFF: 1
      SOURCE_REGISTRY_HOST: "registry.redhat.io"
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get container tools in UBI builder
        run: dnf -y install podman buildah skopeo jq

      - name: Register with Red Hat subscription manager
        run: |
          if [ -n "${{ secrets.RHT_ORGID }}" ] && [ -n "${{ secrets.RHT_ACT_KEY }}" ]; then
            echo "Registering with organization ID and activation key..."
            subscription-manager register --org=${{ secrets.RHT_ORGID }} --activationkey=${{ secrets.RHT_ACT_KEY }}
          else
            echo "Registering with username and password..."
            subscription-manager register --username=${{ secrets.RH_USERNAME }} --password=${{ secrets.RH_PASSWORD }}
          fi

      - name: Get version for this app
        id: version
        run: |
          VERSIONS='${{ needs.setup.outputs.app-versions }}'
          VERSION=$(echo "$VERSIONS" | jq -r '."${{ env.IMAGE_NAME }}"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version for ${{ env.IMAGE_NAME }}: $VERSION"

      - name: Verify Containerfile exists
        run: |
          DIR="${{ matrix.directory }}"
          TYPE="${{ matrix.type }}"
          SUBDIR="${{ matrix.subdir }}"
          if [ -n "$SUBDIR" ]; then
            BUILD_PATH="${DIR}/${TYPE}/${SUBDIR}"
          else
            BUILD_PATH="${DIR}/${TYPE}"
          fi

          if [ -f "${BUILD_PATH}/Containerfile" ]; then
            echo "CONTAINERFILE_PATH=${BUILD_PATH}/Containerfile" >> $GITHUB_ENV
          elif [ -f "${BUILD_PATH}/containerfile" ]; then
            echo "CONTAINERFILE_PATH=${BUILD_PATH}/containerfile" >> $GITHUB_ENV
          else
            echo "Error: No Containerfile found in ${BUILD_PATH}"
            exit 1
          fi
          echo "BUILD_CONTEXT=${BUILD_PATH}" >> $GITHUB_ENV
          echo "Using build context: ${BUILD_PATH}"

      # workaround for https://github.com/redhat-actions/podman-login/issues/42
      - name: Workaround open podman-login action issue
        env:
          auth: "{ \"auths\": {} }"
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Log in to Red Hat Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.SOURCE_REGISTRY_HOST }}
          username: ${{ secrets.SOURCE_REGISTRY_USER || secrets.RH_USERNAME }}
          password: ${{ secrets.SOURCE_REGISTRY_PASSWORD || secrets.RH_PASSWORD }}
          auth_file_path: /run/containers/0/auth.json

      - name: Set architecture tag
        id: arch-tag
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "amd64" ]; then
            ARCH_TAG="x86"
          elif [ "$ARCH" = "arm64" ]; then
            ARCH_TAG="arm"
          else
            ARCH_TAG="$ARCH"
          fi
          echo "arch-tag=$ARCH_TAG" >> $GITHUB_OUTPUT
          echo "Architecture tag for $ARCH: $ARCH_TAG"

      - name: Build platform-specific image with Buildah
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            latest-${{ matrix.arch }}
            ${{ github.sha }}-${{ matrix.arch }}
            ${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ steps.arch-tag.outputs.arch-tag }}
          platforms: ${{ matrix.platform }}
          context: ${{ env.BUILD_CONTEXT }}
          containerfiles: |
            ${{ env.CONTAINERFILE_PATH }}

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: /run/containers/0/auth.json

      - name: Push platform-specific image to GHCR
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Clean up the subscription
        if: always()
        run: subscription-manager unregister

  # Job: Create multi-platform manifest for each app
  create-manifest:
    name: Create multi-platform manifests
    needs: [setup, build-image]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifests
        run: |
          set -euo pipefail

          APPS_JSON='${{ needs.setup.outputs.apps-json }}'
          APP_VERSIONS='${{ needs.setup.outputs.app-versions }}'
          PLATFORMS="${{ needs.setup.outputs.platforms }}"

          for row in $(echo "$APPS_JSON" | jq -c '.[]'); do
            TYPE=$(echo "$row" | jq -r '.type')
            PREFIX=$(echo "$row" | jq -r '.prefix')
            IMAGE_NAME="${PREFIX}-${TYPE}"
            IMAGE_BASE="${{ env.REGISTRY }}/${IMAGE_NAME}"
            VERSION=$(echo "$APP_VERSIONS" | jq -r --arg k "$IMAGE_NAME" '.[$k]')

            LATEST_MANIFEST="${IMAGE_BASE}:latest"
            SHA_MANIFEST="${IMAGE_BASE}:${{ github.sha }}"
            VERSION_MANIFEST="${IMAGE_BASE}:${VERSION}"

            echo "Creating multi-platform manifests for $IMAGE_NAME"

            podman manifest rm "$LATEST_MANIFEST" 2>/dev/null || true
            podman manifest rm "$SHA_MANIFEST" 2>/dev/null || true
            podman manifest rm "$VERSION_MANIFEST" 2>/dev/null || true

            podman manifest create "$LATEST_MANIFEST"
            podman manifest create "$SHA_MANIFEST"
            podman manifest create "$VERSION_MANIFEST"

            IFS=',' read -ra PLATFORM_ARRAY <<< "$PLATFORMS"
            for PLATFORM in "${PLATFORM_ARRAY[@]}"; do
              ARCH="${PLATFORM#linux/}"
              echo "  Adding $ARCH images for $IMAGE_NAME"
              podman manifest add --arch "$ARCH" --os "linux" "$LATEST_MANIFEST" "docker://${IMAGE_BASE}:latest-${ARCH}"
              podman manifest add --arch "$ARCH" --os "linux" "$SHA_MANIFEST" "docker://${IMAGE_BASE}:${{ github.sha }}-${ARCH}"
              podman manifest add --arch "$ARCH" --os "linux" "$VERSION_MANIFEST" "docker://${IMAGE_BASE}:${VERSION}-${ARCH}"
            done

            echo "Inspecting created manifests for $IMAGE_NAME..."
            podman manifest inspect "$LATEST_MANIFEST"
            podman manifest inspect "$SHA_MANIFEST"
            podman manifest inspect "$VERSION_MANIFEST"

            echo "Pushing multi-platform manifests for $IMAGE_NAME..."
            podman manifest push --all "$LATEST_MANIFEST" "docker://$LATEST_MANIFEST"
            podman manifest push --all "$SHA_MANIFEST" "docker://$SHA_MANIFEST"
            podman manifest push --all "$VERSION_MANIFEST" "docker://$VERSION_MANIFEST"

            echo "Multi-platform manifests for $IMAGE_NAME created and pushed successfully!"
            echo "Available tags: latest, ${{ github.sha }}, ${VERSION}"
          done

  # Summary job
  summary:
    name: Build Summary
    needs: [detect-changes, setup, build-image, create-manifest]
    runs-on: ubuntu-latest
    if: always()
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Print build summary
        if: needs.detect-changes.outputs.has-changes == 'true'
        run: |
          APPS_JSON='${{ needs.setup.outputs.apps-json }}'
          APP_VERSIONS='${{ needs.setup.outputs.app-versions }}'
          PLATFORMS="${{ needs.setup.outputs.platforms }}"

          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: $PLATFORMS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apps Built" >> $GITHUB_STEP_SUMMARY

          for row in $(echo "$APPS_JSON" | jq -c '.[]'); do
            TYPE=$(echo "$row" | jq -r '.type')
            DIR=$(echo "$row" | jq -r '.directory')
            PREFIX=$(echo "$row" | jq -r '.prefix')
            IMAGE_NAME="${PREFIX}-${TYPE}"
            VERSION=$(echo "$APP_VERSIONS" | jq -r --arg k "$IMAGE_NAME" '.[$k]')

            echo "#### $DIR/$TYPE ($IMAGE_NAME)" >> $GITHUB_STEP_SUMMARY
            echo "- Latest: ${{ env.REGISTRY }}/${IMAGE_NAME}:latest" >> $GITHUB_STEP_SUMMARY
            echo "- SHA: ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Version: ${{ env.REGISTRY }}/${IMAGE_NAME}:${VERSION}" >> $GITHUB_STEP_SUMMARY

            echo "**Platform-specific Images:**" >> $GITHUB_STEP_SUMMARY
            IFS=',' read -ra PLATFORM_ARRAY <<< "$PLATFORMS"
            for PLATFORM in "${PLATFORM_ARRAY[@]}"; do
              ARCH="${PLATFORM#linux/}"
              if [ "$ARCH" = "amd64" ]; then ARCH_TAG="x86"; elif [ "$ARCH" = "arm64" ]; then ARCH_TAG="arm"; else ARCH_TAG="$ARCH"; fi
              echo "- $ARCH latest: ${{ env.REGISTRY }}/${IMAGE_NAME}:latest-${ARCH}" >> $GITHUB_STEP_SUMMARY
              echo "- $ARCH SHA: ${{ env.REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}-${ARCH}" >> $GITHUB_STEP_SUMMARY
              echo "- $ARCH version: ${{ env.REGISTRY }}/${IMAGE_NAME}:${VERSION}-${ARCH}" >> $GITHUB_STEP_SUMMARY
              echo "- $ARCH specific: ${{ env.REGISTRY }}/${IMAGE_NAME}:${ARCH_TAG}" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Change Detection: ${{ needs.detect-changes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version Determination: ${{ needs.determine-versions.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Setup: ${{ needs.setup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image Build: ${{ needs.build-image.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Manifest Creation: ${{ needs.create-manifest.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Print no changes message
        if: needs.detect-changes.outputs.has-changes == 'false'
        run: |
          echo "## No Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "No app-type changes were detected in the configured directories." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configured groups" >> $GITHUB_STEP_SUMMARY
          echo '${{ env.APP_GROUPS }}' | jq -r '.[] | "- `\(.directory)` -> `\(.prefix)-<type>`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To trigger a build:**" >> $GITHUB_STEP_SUMMARY
          echo "- Push changes to any \`{directory}/{type}/\` under a configured group, or" >> $GITHUB_STEP_SUMMARY
          echo "- Run the workflow manually" >> $GITHUB_STEP_SUMMARY
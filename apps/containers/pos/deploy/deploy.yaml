---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: pos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pos
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: pos
    spec:
      containers:
        - name: container
          image: 'quay.io/luisarizmendi/tailwind-pos:latest'
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: pos
spec:
  selector:
    app: pos
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: pos
spec:
  to:
    kind: Service
    name: pos
    weight: 100
  port:
    targetPort: 8080
  wildcardPolicy: None
apiVersion: flightctl.io/v1alpha1
kind: Fleet
metadata:
  labels:
    environment: demo
  name: simple
spec:
  selector:
    matchLabels:
      fleet: "simple"
  template:
    metadata:
      labels:
        fleet: simple
    spec:
      config:
      - name: motd-update
        configType: InlineConfigProviderSpec
        inline:
          - path: "/etc/motd"
            content: "This system is managed by flightctl."
            mode: 0644
      - gitRef:
          mountPath: /
          path: /configs/simple
          repository: rhem-demo
          targetRevision: main
        name: vms
      systemd:
        matchPatterns:
          - "flightctl-agent.service"
      os:
        image: ghcr.io/luisarizmendi/bootc-rhel:v1




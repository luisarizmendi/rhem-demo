apiVersion: flightctl.io/v1alpha1
kind: Fleet
metadata:
  labels: {}
  name: kvm
spec:
  selector:
    matchLabels:
      fleet: "kvm"
  template:
    metadata:
      labels:
        fleet: kvm
    spec:
      applications: []
      config:
      - name: motd-update
        configType: InlineConfigProviderSpec
        inline:
          - path: "/etc/motd"
            content: "This system is managed by flightctl."
            mode: 0644
      - gitRef:
          mountPath: /
          path: /configs/kvm
          repository: rhem-demo
          targetRevision: main
        name: vms
      systemd:
        matchPatterns:
          - "flightctl-agent.service"
          - "libvirt-vm*.service"
      os:
        image: ghcr.io/luisarizmendi/device-rhel-kvm:latest-amd64




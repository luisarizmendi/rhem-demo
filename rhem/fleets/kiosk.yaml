apiVersion: flightctl.io/v1alpha1
kind: Fleet
metadata:
  labels:
    environment: demo
  name: kiosk
spec:
  selector:
    matchLabels:
      fleet: "kiosk"
  template:
    metadata:
      labels:
        fleet: kiosk
    spec:
      applications:
      - name: pos
        ports:
          - '8080:8080'
        runAs: ''
        appType: container
        resources:
          limits:
            cpu: '1.0'
            memory: 2048m
        catalogItemRef:
          item: pos-container
          catalog: demo
          channel: test
          version: 1.0.0
      - name: postgresql-compose
        appType: compose
        volumes: []
        PGADMIN_PW: pgredhat
        POSTGRES_PW: pgredhat
        catalogItemRef:
          item: postgresql-compose
          catalog: demo
          channel: test
          version: 1.0.0
      config:
      - name: motd-update
        configType: InlineConfigProviderSpec
        inline:
          - path: "/etc/motd"
            content: "This system is managed by flightctl."
            mode: 0644
      - gitRef:
          mountPath: /
          path: /configs/kiosk/site/{{ .metadata.labels.site }}
          repository: rhem-demo
          targetRevision: main
        name: site-conf
      - gitRef:
          mountPath: /
          path: /configs/kiosk/function/{{ .metadata.labels.function }}
          repository: rhem-demo
          targetRevision: main
        name: function-conf
      systemd:
        matchPatterns:
          - "flightctl-agent.service"
      os:
        catalogItemRef:
          item: rhel-kiosk-os
          catalog: demo
          channel: test
          version: 1.0.0



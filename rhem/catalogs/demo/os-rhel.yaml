  apiVersion: flightctl.io/v1alpha1
  kind: CatalogItem
  metadata:
    annotations: {}
    catalog: demo
    labels:
      purpose: demo
    name: rhel-os
  spec:
    artifacts:
    - name: RHEL ISO
      type: anaconda-iso
      uri: ghcr.io/luisarizmendi/device-rhel-anaconda-iso
    - name: RHEL bootc image
      type: container
      uri: ghcr.io/luisarizmendi/device-rhel
    category: system
    displayName: RHEL base
    documentationUrl: https://github.com/luisarizmendi/rhem-demo/blob/main/devices/rhel/README.md
    homepage: https://github.com/luisarizmendi/rhem-demo/pkgs/container/device-rhel
    icon: data:image/webp;base64,
    provider: Luis Arizmendi - Red Hat
    shortDescription: RHEL OS
    support: https://github.com/luisarizmendi/rhem-demo/issues
    type: os
    versions:
    - channels:
      - test
      references:
        anaconda-iso: v1-amd64
        container: v1
      version: 1.0.0
    - channels:
      - test
      references:
        container: v2
      replaces: 1.0.0
      version: 2.0.0

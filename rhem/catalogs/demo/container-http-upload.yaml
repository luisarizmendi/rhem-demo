  apiVersion: flightctl.io/v1alpha1
  kind: CatalogItem
  metadata:
    annotations: {}
    catalog: demo
    labels:
      purpose: demo
    name: http-upload
  spec:
    artifacts:
    - type: container
      uri: ghcr.io/luisarizmendi/app-http-server-upload
    category: application
    displayName: Upload Server
    homepage: https://github.com/luisarizmendi/rhem-demo/pkgs/container/app-http-server-upload
    icon: data:image/png;base64,
    provider: Luis Arizmendi
    shortDescription: HTTP server to upload and host files for demos
    type: container
    versions:
    - channels:
      - test
      references:
        container: v1
      version: 1.0.0

    defaults:
      config:
        ports:
          - "5000:5000"
        resources:
          requests:
            memory: "512m"
            cpu: "0.5"
          limits:
            memory: "2048m"
            cpu: "1.0"
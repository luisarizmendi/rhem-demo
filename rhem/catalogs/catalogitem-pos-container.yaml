  apiVersion: flightctl.io/v1alpha1
  kind: CatalogItem
  metadata:
    annotations: {}
    catalog: demo
    labels:
      purpose: demo
    name: pos-container
  spec:
    artifacts:
    - type: container
      uri: quay.io/luisarizmendi/tailwind-pos
    category: application
    displayName: PoS Tailwind
    homepage: https://github.com/luisarizmendi/tailwind-pos
    icon: data:image/png;base64,
    provider: Luis Arizmend
    shortDescription: A demo Point of Sales (PoS) application based on Tailwind CSS
    type: container
    versions:
    - channels:
      - test
      references:
        container: latest
      version: 1.0.0

    defaults:
        ports:
          - "8080:8080"
        resources:
          requests:
            memory: "512m"
            cpu: "0.5"
          limits:
            memory: "2048m"
            cpu: "1.0"

      configSchema:
        $schema: "http://json-schema.org/draft-07/schema#"
        type: object
        properties:
          initial_dp:
            type: number
            description: Initial Differential Pressure in Pa
            minimum: 0
            maximum: 1000
            default: 50

  apiVersion: flightctl.io/v1alpha1
  kind: CatalogItem
  metadata:
    annotations: {}
    catalog: demo
    labels:
      purpose: demo
    name: postgresql-quadlet
  spec:
    artifacts:
    - type: container
      uri: ghcr.io/luisarizmendi/app-quadlet-postgres
    category: application
    displayName: 'PostgreSQL DB'
    documentationUrl: https://www.postgresql.org/docs/
    homepage: https://www.postgresql.org/
    icon: data:image/webp;base64,
    provider: PostgreSQL
    shortDescription: PostgreSQL Database with pgAdmin based on Quadlets for demo
    support: https://www.postgresql.org/support/
    type: quadlet
    versions:
    - channels:
      - test
      readme: |-
        #  PostgreSQL Quadlet v2.0.0
        It contains latest PostgreSQL and pgAdmin v9.6
      references:
        container: v2
      replaces: 1.0.0
      version: 2.0.0
    - channels:
      - test
      readme: |-
        #  PostgreSQL Quadlet v1.0.0
        It contains latest PostgreSQL and pgAdmin v9.5
      references:
        container: v1
      version: 1.0.0


    defaults:
      config:
        envVars:
          POSTGRES_USER: "postgres"
          POSTGRES_DB: "postgres"
          PGADMIN_MAIL: "pgadmin@none.com"

      configSchema:
        $schema: "http://json-schema.org/draft-07/schema#"
        type: object
        properties:
          POSTGRES_PW:
            type: string
            description: Password for the Database 'postgres' user
            default: "pgredhat"
          PGADMIN_PW:
            type: string
            description: Password for the pgAdmin 'pgadmin@none.com' user
            default: "pgredhat"

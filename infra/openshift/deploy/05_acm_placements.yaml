---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: stores-placement
spec:
  clusterSets:
    - pos
    - infra
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        claimSelector:
          matchExpressions:
            - key: device.status
              operator: In
              values:
                - enabled

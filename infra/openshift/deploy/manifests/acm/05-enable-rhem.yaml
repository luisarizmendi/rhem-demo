---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-rhem
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      serviceAccountName: openshift-gitops-argocd-application-controller
      containers:
      - name: bootstrap-rhem
        image: quay.io/openshift/origin-cli:latest  
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Wait for ACM to be ready
          until oc get pods -n multicluster-engine | grep 'multicluster-engine-operator' | grep 'Running' | grep '1/1'; do
            echo "Waiting for ACM multicluster-engine operator..."
            sleep 10
          done

          # Ensure that Red Hat Edge Manager is enabled
          oc patch multiclusterhubs.operator.open-cluster-management.io multiclusterhub -n open-cluster-management --type json --patch '[{"op": "add", "path":"/spec/overrides/components/-", "value": {"name":"edge-manager-preview","enabled": true}}]'

          sleep 10

          echo "Adding RHEM console plugin"
          oc apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: enable-plugin-rhem-plugin
            namespace: openshift-gitops
          spec:
            template:
              spec:
                serviceAccountName: openshift-gitops-argocd-application-controller
                containers:
                - name: shell
                  image: quay.io/luisarizmendi/ocp-job:latest  
                  command: ["/bin/sh", "-c"]
                  args:
                  - |
                      PLUGIN_NAME="flightctl-plugin"
                      existing_plugins=\$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins[*]}')
                      read -a plugins_array <<< "\$existing_plugins"
                      for plugin in "\${plugins_array[@]}"; do
                          if [[ "\$plugin" == "\$PLUGIN_NAME" ]]; then
                              echo "Plugin \$PLUGIN_NAME is already enabled."
                              exit 0
                          fi
                      done
                      plugins_array+=("\$PLUGIN_NAME")
                      json_array=\$(printf '%s\n' "\${plugins_array[@]}" | jq -R . | jq -s .)

                      echo "Patching with new plugins: \$json_array"
                      oc patch console.operator.openshift.io cluster --type=json -p="[{'op': 'add', 'path': '/spec/plugins', 'value': \$json_array }]"

                      echo "Enabled plugins in the console:"
                      oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}'
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - "ALL"
                    runAsNonRoot: true
                    seccompProfile:
                      type: RuntimeDefault
                restartPolicy: Never
            backoffLimit: 1
          EOF

          echo "Environment ready!"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      restartPolicy: Never
  backoffLimit: 1
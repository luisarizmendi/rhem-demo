---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: stores-pos
  namespace: openshift-gitops
spec:
  clusterSets:
    - stores
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            function: pos
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: stores-infra
  namespace: openshift-gitops
spec:
  clusterSets:
    - stores
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            function: infra